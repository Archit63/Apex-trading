<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        .hero-section {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 120px 0 60px;
            color: white;
        }
        .tradingview-widget-container {
            margin-top: 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .section-title {
            background: #2d3250;
            padding: 15px;
            border-bottom: 1px solid #404670;
            color: #fff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Apex Trading</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="charts.html">Charts</a></li>
                    <li class="nav-item"><a class="nav-link" href="market-india.html">Market India</a></li>
                    <li class="nav-item"><a class="nav-link" href="ticker.html">Ticker</a></li>

                </ul>
            </div>

    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 animate__animated animate__fadeInDown">Top Stories</h1>
            <p class="lead animate__animated animate__fadeIn">Stay updated with the latest news and insights in the financial world.</p>
        </div>
    </header>

    <div class="container py-5">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <div class="tradingview-widget-copyright">
                <a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">
                    <span class="blue-text">Track all markets on TradingView</span>
                </a>
            </div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
            {
                "feedMode"; "all_symbols",
                "isTransparent"; false,
                "displayMode"; "regular",
                "width"; "100%",
                "height"; "550",
                "colorTheme"; "dark",
