<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Trading - Market India</title>
    
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        .hero-section {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 120px 0 60px;
            color: white;
        }
        .market-widget {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-top: 30px;
        }
        .widget-header {
            background: #2d3250;
            padding: 15px;
            border-bottom: 1px solid #404670;
        }
        .gradient-text {
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="apex_logo_major_project.jpg" alt="Apex Trading Logo" width="40" class="me-2">
                Apex Trading
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="charts.html">Charts</a></li>
                    <li class="nav-item"><a class="nav-link active" href="market-india.html">Market India</a></li>
                    <li class="nav-item"><a class="nav-link" href="ticker.html">Ticker</a></li>
                    <li class="nav-item"><a class="nav-link" href="news.html">Top Stories</a></li>
                    <li class="nav-item"><a class="nav-link" href="calendar.html">Economic Calendar</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero-section">
        <div class="container text-center">
            <h1 class="display-4 animate__animated animate__fadeInDown">
                Indian Market <span class="gradient-text">Insights</span>
            </h1>
            <p class="lead animate__animated animate__fadeIn">
                Real-time analysis of Indian stock market trends and movements
            </p>
        </div>
    </header>

    <!-- Market Widget -->
    <div class="container py-5">
        <div class="market-widget">
            <div class="widget-header">
                <h4 class="text-light mb-0">Live Market Data - BSE/NSE</h4>
            </div>
            <div class="tradingview-widget-container p-3">
                <div class="tradingview-widget-container__widget" style="height:600px"></div>
                <div class="tradingview-widget-copyright">
                    <a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">
                        <span class="text-muted">Track all markets on TradingView</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- TradingView Script -->
    <script type="text/javascript">
        (function() {
            var script = document.createElement("script");
            script.src = "https://s3.tradingview.com/external-embedding/embed-widget-hotlists.js";
            script.async = true;
            script.innerHTML = JSON.stringify({
                "colorTheme": "dark",
                "dateRange": "ALL",
                "exchange": "BSE",
                "showChart": true,
                "locale": "en",
                "width": "100%",
                "height": "100%",
                "isTransparent": false,
                "plotLineColorGrowing": "rgba(78, 84, 200, 1)",
                "plotLineColorFalling": "rgba(78, 84, 200, 1)",
                "gridLineColor": "rgba(42, 46, 57, 0)",
                "scaleFontColor": "rgba(219, 219, 219, 1)",
                "belowLineFillColorGrowing": "rgba(78, 84, 200, 0.12)",
                "belowLineFillColorFalling": "rgba(78, 84, 200, 0.12)",
                "symbolActiveColor": "rgba(78, 84, 200, 0.12)"
            });
            document.querySelector(".tradingview-widget-container__widget").appendChild(script);
        })();
    </script>

    <!-- Footer -->
    <footer class="bg-dark text-light text-center py-4">
        <p>&copy; 2025 Apex Trading. All rights reserved by Archit.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" defer></script>

</body>
</html>
